[package]
name = "snake"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "A tiny Snake game for the BBC micro:bit, built on tiny_ecs."

[[bin]]
name = "snake"
path = "src/main.rs"

[dependencies]
bevy_microbit = { path = "../../bevy_microbit" }
cortex-m = { version = "0.7.8", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
heapless.workspace = true
panic-rtt-target = "0.2.0"
rtt-target = "0.6.2"
tiny_ecs.workspace = true
tiny_ecs_macros.workspace = true

[lints]
workspace = true
