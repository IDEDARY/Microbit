[package]
  description       = "The ported debris-dodging game, written as a desktop-style Bevy app."
  edition.workspace = true
  license.workspace = true
  name              = "game"
  publish           = false
  version.workspace = true

[[bin]]
  name = "game"
  path = "src/main.rs"

[dependencies]
  bevy_microbit = { path = "../../bevy_microbit" }
  # Direct deps are required so the `Component`/`Resource` derive macros can
  # resolve the `bevy_ecs` crate path in their generated code.
  bevy_ecs.workspace  = true
  bevy_time.workspace = true
  cortex-m            = { version = "0.7.8", features = ["critical-section-single-core"] }
  cortex-m-rt         = "0.7.6"
  embedded-alloc      = "0.7"
  panic-rtt-target    = "0.2.0"
  rtt-target          = "0.6.2"

[lints]
  workspace = true
