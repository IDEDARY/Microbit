[package]
   description       = "The ported debris-dodging game, written as a desktop-style app."
   edition.workspace = true
   license.workspace = true
   name              = "game"
   publish           = false
   version.workspace = true

[[bin]]
   name = "game"
   path = "src/main.rs"

[dependencies]
   bevy_microbit             = { path = "../../bevy_microbit" }
   cortex-m                  = { version = "0.7.8", features = ["critical-section-single-core"] }
   cortex-m-rt               = "0.7.6"
   heapless.workspace        = true
   panic-rtt-target          = "0.2.0"
   rtt-target                = "0.6.2"
   tiny_ecs.workspace        = true
   tiny_ecs_macros.workspace = true

[lints]
   workspace = true
