# Workspace manifest for the Microbit game, powered by `tiny_ecs`.
#
# All hardware interaction lives in the `bevy_microbit` library crate, exposed
# through a Bevy-idiomatic API (`App`, `Plugin`, `Startup`/`Update` schedules,
# `Res<Time>`, `ButtonInput`, `FrameBuffer`). The actual game lives in
# `examples/game` and is intentionally free of any Microbit-specific types so it
# reads like a desktop app.
[workspace]
resolver = "2"
members = ["tiny_ecs", "tiny_ecs_macros", "bevy_microbit", "examples/game", "examples/snake"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your/repo"
readme = "README.md"

# Shared dependency versions, resolved once per workspace.
[workspace.dependencies]
tiny_ecs = { path = "tiny_ecs" }
tiny_ecs_macros = { path = "tiny_ecs_macros" }
heapless = "0.8"
cortex-m = { version = "0.7.8", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
embedded-hal = "1.0.0"
microbit = "0.16.0"
rtt-target = "0.6.2"
tinyrand = "0.5.0"

# A Microbit V1 has 256 KiB of flash and only 16 KiB of RAM, so we optimise
# aggressively for size and link a single fat-LTO unit.
[profile.release]
codegen-units = 1
debug = 0
lto = "fat"
opt-level = "z"
panic = "abort"
#strip = true

[workspace.lints.clippy]
# Warn when an app accidentally reaches for `std` while `core`/`alloc` would do.
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"